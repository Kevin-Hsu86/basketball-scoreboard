<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>籃球電子計分板</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #111;
      color: #fff;
      text-align: center;
    }
    h1 { margin: 20px 0 10px; }

    /* 計時器 */
    .timer {
      background: #222;
      border-radius: 12px;
      display: inline-block;
      padding: 15px 30px;
      margin: 10px;
    }
    #clock {
      font-size: 80px;
      font-weight: bold;
      color: #4cd964;
      font-family: monospace;
    }
    #clock.over {
      color: #ff3b30;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      50% { opacity: 0.3; }
    }
    .timer input {
      width: 60px;
      font-size: 18px;
      text-align: center;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px;
    }

    /* 兩隊計分區 */
    .board {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      padding: 20px;
    }
    .team {
      background: #222;
      border-radius: 12px;
      padding: 20px;
      width: 260px;
    }
    .team input {
      font-size: 22px;
      text-align: center;
      width: 90%;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px;
    }
    .score {
      font-size: 96px;
      font-weight: bold;
      color: #ffcc00;
      margin: 15px 0;
    }
    .foul-area {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid #444;
      font-size: 20px;
    }
    .foul-count {
      font-size: 36px;
      font-weight: bold;
      margin: 0 8px;
    }
    .foul-count.warn { color: #ff3b30; }

    button {
      font-size: 18px;
      margin: 4px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #ff7a00;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #ff9500; }
    button.minus { background: #555; }
    button.foul { background: #8e44ad; }
    .reset { background: #c0392b; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>🏀 籃球電子計分板</h1>

  <!-- 計時器 -->
  <div class="timer">
    <div id="clock">10:00</div>
    <button id="startBtn" onclick="toggleTimer()">開始</button>
    <button class="minus" onclick="resetTimer()">重設時間</button>
    <div>
      每節
      <input type="number" id="minutes" value="10" min="1" max="60">
      分鐘
      <button class="minus" onclick="setMinutes()">套用</button>
    </div>
  </div>

  <!-- 兩隊計分區 -->
  <div class="board">
    <div class="team">
      <input id="nameA" value="主隊">
      <div class="score" id="scoreA">0</div>
      <button onclick="addScore('A', 1)">+1</button>
      <button onclick="addScore('A', 2)">+2</button>
      <button onclick="addScore('A', 3)">+3</button>
      <br>
      <button class="minus" onclick="addScore('A', -1)">-1</button>

      <div class="foul-area">
        犯規
        <span class="foul-count" id="foulA">0</span>
        <br>
        <button class="foul" onclick="addFoul('A', 1)">犯規 +1</button>
        <button class="minus" onclick="addFoul('A', -1)">-1</button>
      </div>
    </div>

    <div class="team">
      <input id="nameB" value="客隊">
      <div class="score" id="scoreB">0</div>
      <button onclick="addScore('B', 1)">+1</button>
      <button onclick="addScore('B', 2)">+2</button>
      <button onclick="addScore('B', 3)">+3</button>
      <br>
      <button class="minus" onclick="addScore('B', -1)">-1</button>

      <div class="foul-area">
        犯規
        <span class="foul-count" id="foulB">0</span>
        <br>
        <button class="foul" onclick="addFoul('B', 1)">犯規 +1</button>
        <button class="minus" onclick="addFoul('B', -1)">-1</button>
      </div>
    </div>
  </div>

  <button class="reset" onclick="resetAll()">全部歸零</button>

  <script>
    // ===== 資料 =====
    var scores = { A: 0, B: 0 };
    var fouls = { A: 0, B: 0 };
    var totalMs = 10 * 60 * 1000;   // 每節總時間（毫秒）
    var remaining = totalMs;        // 剩餘時間
    var endTime = 0;                // 預計結束的時間點
    var timerId = null;             // 計時器編號（null 代表沒在跑）

    // ===== 比分 =====
    function addScore(team, points) {
      scores[team] = scores[team] + points;
      if (scores[team] < 0) {
        scores[team] = 0;
      }
      document.getElementById('score' + team).textContent = scores[team];
    }

    // ===== 犯規 =====
    function addFoul(team, n) {
      fouls[team] = fouls[team] + n;
      if (fouls[team] < 0) {
        fouls[team] = 0;
      }
      showFoul(team);
    }

    function showFoul(team) {
      var el = document.getElementById('foul' + team);
      el.textContent = fouls[team];
      if (fouls[team] >= 5) {
        el.classList.add('warn');
      } else {
        el.classList.remove('warn');
      }
    }

    // ===== 計時器 =====
    function pad(n) {
      return n < 10 ? '0' + n : '' + n;
    }

    function showClock() {
      var totalSec = Math.ceil(remaining / 1000);
      var m = Math.floor(totalSec / 60);
      var s = totalSec % 60;
      document.getElementById('clock').textContent = pad(m) + ':' + pad(s);
    }

    function tick() {
      remaining = endTime - Date.now();
      if (remaining <= 0) {
        remaining = 0;
        stopTimer();
        document.getElementById('clock').classList.add('over');
        document.getElementById('startBtn').textContent = '開始';
      }
      showClock();
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function toggleTimer() {
      var btn = document.getElementById('startBtn');
      if (timerId === null) {
        if (remaining <= 0) {
          return;
        }
        endTime = Date.now() + remaining;
        timerId = setInterval(tick, 100);
        btn.textContent = '暫停';
      } else {
        remaining = endTime - Date.now();
        stopTimer();
        btn.textContent = '繼續';
      }
    }

    function resetTimer() {
      stopTimer();
      remaining = totalMs;
      document.getElementById('clock').classList.remove('over');
      document.getElementById('startBtn').textContent = '開始';
      showClock();
    }

    function setMinutes() {
      var m = parseInt(document.getElementById('minutes').value, 10);
      if (isNaN(m) || m < 1 || m > 60) {
        alert('請輸入 1 到 60 之間的整數');
        return;
      }
      totalMs = m * 60 * 1000;
      resetTimer();
    }

    // ===== 全部歸零 =====
    function resetAll() {
      scores.A = 0;
      scores.B = 0;
      fouls.A = 0;
      fouls.B = 0;
      document.getElementById('scoreA').textContent = 0;
      document.getElementById('scoreB').textContent = 0;
      showFoul('A');
      showFoul('B');
      resetTimer();
    }
  </script>
</body>
</html>
