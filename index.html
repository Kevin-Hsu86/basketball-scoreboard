<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10131b">
  <title>籃球電子計分板</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10131b;
      --panel: #222a37;
      --panel-dark: #151a24;
      --line: #394456;
      --text: #f5f7fb;
      --muted: #aab3c2;
      --orange: #ff7a00;
      --yellow: #ffd23f;
      --green: #62e58a;
      --red: #ff5a57;
      --purple: #8650b3;
      --gray: #505b6d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 14px;
      color: var(--text);
      background: radial-gradient(ellipse at top, #20293a 0, var(--bg) 58%);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    button, input { font: inherit; }

    button {
      min-height: 40px;
      margin: 3px;
      padding: 8px 12px;
      border: 0;
      border-radius: 9px;
      background: var(--orange);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active { transform: scale(.97); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.secondary { background: var(--gray); }
    button.purple { background: var(--purple); }
    button.danger { background: #b93b3b; }

    button:focus-visible, input:focus-visible {
      outline: 3px solid #8bc7ff;
      outline-offset: 2px;
    }

    input {
      min-width: 0;
      min-height: 40px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111722;
      color: var(--text);
      text-align: center;
      touch-action: manipulation;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.2rem, 2.8vw, 1.8rem);
    }

    .toolbar, .period-bar, .timer-row, .team-controls, .small-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .toolbar { margin: 0 auto 8px; }

    .toolbar button {
      min-height: 36px;
      padding: 6px 10px;
      font-size: .9rem;
    }

    .period-bar {
      width: fit-content;
      margin: 0 auto;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel-dark);
    }

    .period-number {
      min-width: 90px;
      font-size: 1.05rem;
      font-weight: 900;
    }

    .main-timers {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 8px;
    }

    .timer-card, .team, .center-panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: linear-gradient(145deg, #252d3b, #171c26);
    }

    .timer-card {
      flex: 1 1 0;
      padding: 8px 10px;
    }

    .timer-label {
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .clock {
      color: var(--green);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: clamp(2.7rem, 6vw, 4.6rem);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    #shotClock { color: var(--yellow); }

    .clock.expired {
      color: var(--red);
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: .35; }
    }

    .timer-row { gap: 3px; }

    .timer-row button {
      min-height: 36px;
      margin: 2px;
      padding: 5px 8px;
      font-size: .88rem;
    }

    .duration-setting {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3px;
      margin-top: 5px;
      color: var(--muted);
      font-size: .82rem;
    }

    .duration-setting input {
      width: 62px;
      min-height: 38px;
      font-size: 16px;
    }

    .duration-setting button {
      min-height: 36px;
      margin: 1px;
      padding: 4px 9px;
      font-size: .84rem;
    }

    .board {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(190px, .62fr) minmax(0, 1fr);
      gap: 8px;
      align-items: stretch;
      max-width: 1500px;
      margin: 0 auto;
    }

    .team, .center-panel {
      padding: clamp(10px, 1.5vw, 18px);
      background: linear-gradient(155deg, #222a37, #171c25);
    }

    .team-name {
      width: 100%;
      min-height: 42px;
      padding: 5px;
      font-size: 1.2rem;
      font-weight: 900;
    }

    .score {
      margin: 4px 0;
      color: var(--yellow);
      font-size: clamp(4.5rem, 9vw, 7rem);
      font-weight: 900;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .score-buttons button {
      min-width: 58px;
      min-height: 48px;
      font-size: 1.15rem;
    }

    .team-controls { margin-top: 0; }

    .team-controls button {
      min-height: 36px;
      padding: 5px 10px;
      font-size: .9rem;
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--line);
      text-align: left;
    }

    .stat-label {
      color: var(--muted);
      font-weight: 800;
    }

    .stat-value {
      min-width: 26px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .stat-value.warn { color: var(--red); }

    .small-controls { gap: 2px; }

    .small-controls button {
      min-width: 38px;
      min-height: 34px;
      margin: 1px;
      padding: 4px 8px;
      font-size: .9rem;
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .center-panel h2 {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .possession-block {
      display: grid;
      width: 100%;
      max-width: 300px;
      gap: 4px;
      color: var(--muted);
      font-size: .82rem;
      font-weight: 800;
    }

    .possession {
      min-height: 42px;
      margin: 0;
      border: 1px solid #576477;
      background: #293243;
      font-size: .95rem;
    }

    .rule-setting {
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: .84rem;
      font-weight: 700;
    }

    .rule-setting input {
      width: 70px;
      margin: 0 auto;
      font-size: 16px;
    }

    .status {
      min-height: 1.2em;
      color: var(--green);
      font-size: .78rem;
    }

    .bottom-actions { margin: 8px auto 4px; }

    .bottom-actions button {
      min-height: 36px;
      padding: 5px 10px;
      font-size: .84rem;
    }

    .help {
      max-width: 900px;
      margin: 6px auto 0;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.45;
    }

    /* 桌機：上排計時器／節次，下排主隊／球權設定／客隊 */
    @media (min-width: 761px) {
      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto auto minmax(180px, .75fr) minmax(300px, 1.25fr) auto auto;
        grid-template-areas:
          "title title title"
          "tools tools tools"
          "game period shot"
          "home center away"
          "actions actions actions"
          "help help help";
        gap: 7px 9px;
        align-content: start;
      }

      h1 { grid-area: title; }
      .toolbar { grid-area: tools; margin: 0; }
      .period-bar { grid-area: period; align-self: center; }

      .main-timers { display: contents; }
      .timer-card:first-child { grid-area: game; }
      .timer-card:last-child { grid-area: shot; }

      .timer-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 7px 10px;
      }

      .board { display: contents; }
      .team:first-child { grid-area: home; }
      .center-panel { grid-area: center; }
      .team:last-child { grid-area: away; }

      .bottom-actions { grid-area: actions; margin: 0; }
      .help { grid-area: help; margin: 0 auto; }
    }

    /* 平板與手機直向：完整功能，內容可往下捲動 */
    @media (max-width: 760px) {
      body { padding: 9px; }
      h1 { margin-bottom: 7px; }
      .toolbar { margin-bottom: 7px; }
      .toolbar button { min-height: 35px; font-size: .82rem; }
      .period-bar { margin: 0 auto 8px; }
      .main-timers { flex-direction: column; gap: 7px; margin-bottom: 8px; }
      .timer-card { width: 100%; padding: 8px; }
      .clock { font-size: clamp(2.8rem, 11vw, 4rem); }
      .board { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 7px; }
      .team { padding: 9px 6px; }
      .team-name { min-height: 38px; font-size: 1rem; }
      .score { font-size: clamp(3.5rem, 17vw, 5rem); }
      .center-panel { grid-column: 1 / -1; grid-row: 2; padding: 10px; }
      .center-panel h2 { font-size: .92rem; }
      .possession-block { max-width: 320px; }
    }

    /* 手機橫向：五欄網格，設定欄位仍可操作 */
    @media (orientation: landscape) and (max-width: 900px) {
      body {
        width: 100%;
        height: 100svh;
        min-height: 0;
        overflow: auto;
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas:
          "tools tools tools tools tools"
          "game game period shot shot"
          "home home center away away";
        gap: 5px;
        padding: max(5px, env(safe-area-inset-top)) max(6px, env(safe-area-inset-right)) 5px max(6px, env(safe-area-inset-left));
      }

      h1 { display: none; }
      .toolbar { grid-area: tools; margin: 0; }
      .toolbar button { min-height: 32px; padding: 4px 8px; font-size: .78rem; }
      .period-bar { grid-area: period; align-self: center; margin: 0 auto; padding: 2px 4px; }
      .period-bar button { min-height: 30px; padding: 2px 7px; }
      .period-number { min-width: 65px; font-size: .85rem; }

      .main-timers { display: contents; }
      .timer-card:first-child { grid-area: game; }
      .timer-card:last-child { grid-area: shot; }
      .timer-card { padding: 5px 3px; border-radius: 9px; }
      .timer-label { font-size: .72rem; }
      .clock { font-size: clamp(1.6rem, 7.5vh, 2.6rem); }
      .timer-row { gap: 1px; }
      .timer-row button { min-height: 34px; padding: 3px 5px; font-size: .7rem; }
      .duration-setting { gap: 2px; margin-top: 3px; font-size: .66rem; }
      .duration-setting input { width: 43px; min-height: 34px; padding: 3px; font-size: 16px; }
      .duration-setting button { min-height: 32px; padding: 3px 5px; font-size: .68rem; }

      .board { display: contents; }
      .team:first-child { grid-area: home; }
      .center-panel { grid-area: center; }
      .team:last-child { grid-area: away; }
      .team { padding: 5px 3px; border-radius: 9px; }
      .team-name { min-height: 28px; padding: 2px; font-size: .85rem; }
      .score { margin: 2px 0; font-size: clamp(2.8rem, 14vh, 4.7rem); }
      .score-buttons button { min-width: 38px; min-height: 35px; margin: 1px; padding: 2px 5px; font-size: .88rem; }
      .team-controls button { min-height: 30px; margin: 1px; padding: 2px 6px; font-size: .74rem; }
      .stat-row { gap: 2px; margin-top: 3px; padding-top: 2px; }
      .stat-label { font-size: .65rem; }
      .stat-value { min-width: 17px; font-size: .95rem; }
      .small-controls { gap: 1px; }
      .small-controls button { min-width: 28px; min-height: 28px; margin: 1px; padding: 2px 4px; font-size: .72rem; }
      .center-panel { gap: 4px; padding: 4px 2px; border-radius: 9px; }
      .center-panel h2 { font-size: .68rem; }
      .possession-block { gap: 2px; font-size: .58rem; }
      .possession { min-height: 30px; padding: 2px; font-size: .62rem; }
      .rule-setting { gap: 2px; font-size: .55rem; }
      .rule-setting input { width: 38px; min-height: 30px; font-size: 16px; }
      .status { min-height: 0; font-size: .55rem; }
      .bottom-actions, .help { display: none; }
    }
  </style>
</head>
<body>
  <h1>🏀 籃球電子計分板</h1>

  <div class="toolbar" aria-label="工具列">
    <button class="secondary" id="undoBtn" type="button" onclick="undo()">↶ 復原上一步</button>
    <button class="secondary" type="button" onclick="toggleFullscreen()">⛶ 全螢幕</button>
    <button class="danger" type="button" onclick="resetGame()">重新開始比賽</button>
  </div>

  <section class="period-bar" aria-label="節次控制">
    <button class="secondary" type="button" aria-label="上一節" onclick="changePeriod(-1)">−</button>
    <div class="period-number" id="periodLabel">第 1 節</div>
    <button class="secondary" type="button" aria-label="下一節" onclick="changePeriod(1)">＋</button>
  </section>

  <section class="main-timers" aria-label="計時器">
    <div class="timer-card">
      <div class="timer-label">比賽時間</div>
      <div class="clock" id="gameClock">10:00</div>
      <div class="timer-row">
        <button id="gameToggle" type="button" onclick="toggleGameClock()">開始</button>
        <button class="secondary" type="button" onclick="resetGameClock()">重設本節</button>
      </div>
      <div class="duration-setting">
        每節分鐘數
        <input id="periodMinutes" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="60" value="10" aria-label="每節分鐘數">
        <button class="secondary" type="button" onclick="applyPeriodMinutes()">套用</button>
      </div>
    </div>

    <div class="timer-card">
      <div class="timer-label">進攻時間</div>
      <div class="clock" id="shotClock">24</div>
      <div class="timer-row">
        <button id="shotToggle" type="button" onclick="toggleShotClock()">開始</button>
        <button class="secondary" type="button" onclick="resetShotClock(24)">重設 24 秒</button>
        <button class="secondary" type="button" onclick="resetShotClock(14)">重設 14 秒</button>
      </div>
      <div class="duration-setting">
        重設秒數
        <input id="shotSeconds" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="60" value="24" aria-label="進攻時間重設秒數">
        <button class="secondary" type="button" onclick="applyShotSeconds()">自訂</button>
      </div>
    </div>
  </section>

  <main class="board">
    <section class="team" aria-label="主隊">
      <input class="team-name" id="nameA" maxlength="18" value="主隊" aria-label="主隊名稱">
      <div class="score" id="scoreA">0</div>
      <div class="score-buttons">
        <button type="button" onclick="addScore('A',1)">+1</button>
        <button type="button" onclick="addScore('A',2)">+2</button>
        <button type="button" onclick="addScore('A',3)">+3</button>
      </div>
      <div class="team-controls">
        <button class="secondary" type="button" onclick="addScore('A',-1)">−1 分</button>
      </div>
      <div class="stat-row foul-row">
        <span class="stat-label">團隊犯規</span>
        <span class="stat-value" id="foulsA">0</span>
        <span class="small-controls">
          <button class="purple" type="button" onclick="changeStat('fouls','A',1)" aria-label="主隊犯規加一">＋</button>
          <button class="secondary" type="button" onclick="changeStat('fouls','A',-1)" aria-label="主隊犯規減一">−</button>
        </span>
      </div>
      <div class="stat-row timeout-row">
        <span class="stat-label">暫停</span>
        <span class="stat-value" id="timeoutsA">2</span>
        <span class="small-controls">
          <button type="button" onclick="changeStat('timeouts','A',-1)">使用</button>
          <button class="secondary" type="button" onclick="changeStat('timeouts','A',1)">＋</button>
        </span>
      </div>
    </section>

    <section class="center-panel" aria-label="目前球權與比賽設定">
      <div class="possession-block">
        <span>目前球權</span>
        <button class="possession" id="possessionBtn" type="button" onclick="switchPossession()">主隊持球　⇄</button>
      </div>
      <h2>比賽設定</h2>
      <label class="rule-setting">
        每隊初始暫停數
        <input id="timeoutsPerTeam" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="20" value="2" aria-label="每隊初始暫停數">
      </label>
      <div class="status" id="status" aria-live="polite"></div>
    </section>

    <section class="team" aria-label="客隊">
      <input class="team-name" id="nameB" maxlength="18" value="客隊" aria-label="客隊名稱">
      <div class="score" id="scoreB">0</div>
      <div class="score-buttons">
        <button type="button" onclick="addScore('B',1)">+1</button>
        <button type="button" onclick="addScore('B',2)">+2</button>
        <button type="button" onclick="addScore('B',3)">+3</button>
      </div>
      <div class="team-controls">
        <button class="secondary" type="button" onclick="addScore('B',-1)">−1 分</button>
      </div>
      <div class="stat-row foul-row">
        <span class="stat-label">團隊犯規</span>
        <span class="stat-value" id="foulsB">0</span>
        <span class="small-controls">
          <button class="purple" type="button" onclick="changeStat('fouls','B',1)" aria-label="客隊犯規加一">＋</button>
          <button class="secondary" type="button" onclick="changeStat('fouls','B',-1)" aria-label="客隊犯規減一">−</button>
        </span>
      </div>
      <div class="stat-row timeout-row">
        <span class="stat-label">暫停</span>
        <span class="stat-value" id="timeoutsB">2</span>
        <span class="small-controls">
          <button type="button" onclick="changeStat('timeouts','B',-1)">使用</button>
          <button class="secondary" type="button" onclick="changeStat('timeouts','B',1)">＋</button>
        </span>
      </div>
    </section>
  </main>

  <div class="bottom-actions">
    <button class="secondary" type="button" onclick="resetTeamFouls()">本節犯規歸零</button>
    <button class="secondary" type="button" onclick="resetShotClock(24)">進攻時間重設 24 秒</button>
  </div>

  <p class="help">
    快捷鍵：主隊得分 1／2／3；客隊得分 Q／W／E；空白鍵開始或暫停比賽時間。
    資料會自動保存在目前裝置的瀏覽器。
  </p>

  <script>
    "use strict";

    const STORAGE_KEY = "basketball-scoreboard-v2";
    const DEFAULTS = {
      scores: { A: 0, B: 0 },
      fouls: { A: 0, B: 0 },
      timeouts: { A: 2, B: 2 },
      possession: "A",
      period: 1,
      periodMinutes: 10,
      timeoutsPerTeam: 2,
      shotResetSeconds: 24,
      gameRemaining: 600000,
      gameRunning: false,
      gameEndAt: 0,
      shotRemaining: 24000,
      shotRunning: false,
      shotEndAt: 0,
      nameA: "主隊",
      nameB: "客隊"
    };

    let state = loadState();
    let history = [];
    let intervalId = null;

    function cloneDefaults() {
      return JSON.parse(JSON.stringify(DEFAULTS));
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!saved || typeof saved !== "object") return cloneDefaults();

        const restored = { ...cloneDefaults(), ...saved };
        restored.scores = { ...DEFAULTS.scores, ...(saved.scores || {}) };
        restored.fouls = { ...DEFAULTS.fouls, ...(saved.fouls || {}) };
        restored.timeouts = { ...DEFAULTS.timeouts, ...(saved.timeouts || {}) };

        // 舊版資料沒有自訂秒數時，以目前剩餘秒數作為初始值。
        if (!Number.isFinite(Number(saved.shotResetSeconds))) {
          restored.shotResetSeconds = Math.max(1, Math.ceil((restored.shotRemaining || 24000) / 1000));
        }

        if (restored.gameRunning) {
          restored.gameRemaining = Math.max(0, Number(restored.gameEndAt) - Date.now());
        }
        if (restored.shotRunning) {
          restored.shotRemaining = Math.max(0, Number(restored.shotEndAt) - Date.now());
        }
        if (restored.gameRemaining <= 0) {
          restored.gameRemaining = 0;
          restored.gameRunning = false;
        }
        if (restored.shotRemaining <= 0) {
          restored.shotRemaining = 0;
          restored.shotRunning = false;
        }
        return restored;
      } catch {
        return cloneDefaults();
      }
    }

    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (error) {
        console.warn("無法儲存計分板資料：", error);
      }
    }

    function snapshot() {
      history.push(JSON.stringify(state));
      if (history.length > 50) history.shift();
    }

    function update(action) {
      snapshot();
      action();
      persist();
      render();
    }

    function undo() {
      const previous = history.pop();
      if (!previous) {
        announce("目前沒有可復原的操作");
        return;
      }
      state = JSON.parse(previous);
      persist();
      render();
      announce("已復原上一步");
    }

    function addScore(team, points) {
      update(() => {
        state.scores[team] = Math.max(0, state.scores[team] + points);
      });
    }

    function changeStat(kind, team, amount) {
      update(() => {
        state[kind][team] = Math.max(0, state[kind][team] + amount);
      });
    }

    function changePeriod(amount) {
      update(() => {
        state.period = Math.max(1, state.period + amount);
        state.fouls = { A: 0, B: 0 };
        state.gameRunning = false;
        state.gameEndAt = 0;
        state.gameRemaining = state.periodMinutes * 60000;
        state.shotRunning = false;
        state.shotEndAt = 0;
        state.shotRemaining = state.shotResetSeconds * 1000;
      });
    }

    function switchPossession() {
      update(() => {
        state.possession = state.possession === "A" ? "B" : "A";
      });
    }

    function applyPeriodMinutes() {
      const input = document.getElementById("periodMinutes");
      const minutes = Number.parseInt(input.value, 10);

      if (!Number.isInteger(minutes) || minutes < 1 || minutes > 60) {
        announce("每節分鐘數請輸入 1 到 60 的整數");
        input.focus();
        return;
      }

      update(() => {
        state.periodMinutes = minutes;
        state.gameRemaining = minutes * 60000;
        state.gameRunning = false;
        state.gameEndAt = 0;
      });
      announce("每節時間已套用");
    }

    function applyShotSeconds() {
      const input = document.getElementById("shotSeconds");
      const seconds = Number.parseInt(input.value, 10);

      if (!Number.isInteger(seconds) || seconds < 1 || seconds > 60) {
        announce("重設秒數請輸入 1 到 60 的整數");
        input.focus();
        return;
      }

      update(() => {
        state.shotResetSeconds = seconds;
        state.shotRemaining = seconds * 1000;
        state.shotRunning = false;
        state.shotEndAt = 0;
      });
      announce("進攻時間重設秒數已套用");
    }

    function applyTimeoutRule() {
      const input = document.getElementById("timeoutsPerTeam");
      const count = Number.parseInt(input.value, 10);

      if (!Number.isInteger(count) || count < 0 || count > 20) {
        announce("每隊初始暫停數請輸入 0 到 20 的整數");
        input.focus();
        return;
      }

      update(() => {
        state.timeoutsPerTeam = count;
        state.timeouts = { A: count, B: count };
      });
      announce("兩隊初始暫停數已更新");
    }

    function resetGameClock() {
      update(() => {
        state.gameRunning = false;
        state.gameEndAt = 0;
        state.gameRemaining = state.periodMinutes * 60000;
      });
    }

    function toggleGameClock() {
      update(() => {
        if (state.gameRunning) {
          state.gameRemaining = Math.max(0, state.gameEndAt - Date.now());
          state.gameRunning = false;
          state.gameEndAt = 0;
        } else if (state.gameRemaining > 0) {
          state.gameRunning = true;
          state.gameEndAt = Date.now() + state.gameRemaining;
        }
      });
      ensureTicker();
    }

    function resetShotClock(seconds) {
      const safeSeconds = Math.max(1, Math.min(60, Number(seconds) || 24));
      update(() => {
        state.shotResetSeconds = safeSeconds;
        state.shotRunning = false;
        state.shotEndAt = 0;
        state.shotRemaining = safeSeconds * 1000;
      });
    }

    function toggleShotClock() {
      update(() => {
        if (state.shotRunning) {
          state.shotRemaining = Math.max(0, state.shotEndAt - Date.now());
          state.shotRunning = false;
          state.shotEndAt = 0;
        } else if (state.shotRemaining > 0) {
          state.shotRunning = true;
          state.shotEndAt = Date.now() + state.shotRemaining;
        }
      });
      ensureTicker();
    }

    function resetTeamFouls() {
      update(() => {
        state.fouls = { A: 0, B: 0 };
      });
      announce("兩隊本節犯規已歸零");
    }

    function resetGame() {
      if (!confirm("確定重新開始比賽？比分、犯規、暫停與計時都會重設。")) return;

      snapshot();
      state = {
        ...cloneDefaults(),
        nameA: state.nameA,
        nameB: state.nameB,
        periodMinutes: state.periodMinutes,
        shotResetSeconds: state.shotResetSeconds,
        timeoutsPerTeam: state.timeoutsPerTeam,
        gameRemaining: state.periodMinutes * 60000,
        shotRemaining: state.shotResetSeconds * 1000,
        timeouts: { A: state.timeoutsPerTeam, B: state.timeoutsPerTeam }
      };
      persist();
      render();
      announce("比賽已重新開始");
    }

    function formatClock(milliseconds) {
      const totalSeconds = Math.ceil(Math.max(0, milliseconds) / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    function render() {
      document.getElementById("scoreA").textContent = state.scores.A;
      document.getElementById("scoreB").textContent = state.scores.B;
      document.getElementById("foulsA").textContent = state.fouls.A;
      document.getElementById("foulsB").textContent = state.fouls.B;
      document.getElementById("timeoutsA").textContent = state.timeouts.A;
      document.getElementById("timeoutsB").textContent = state.timeouts.B;
      document.getElementById("foulsA").classList.toggle("warn", state.fouls.A >= 5);
      document.getElementById("foulsB").classList.toggle("warn", state.fouls.B >= 5);
      document.getElementById("periodLabel").textContent = `第 ${state.period} 節`;

      // 計時每 0.1 秒更新畫面；若設定欄位正處於編輯狀態，就保留使用者輸入。
      const periodInput = document.getElementById("periodMinutes");
      const shotInput = document.getElementById("shotSeconds");
      const timeoutInput = document.getElementById("timeoutsPerTeam");
      if (document.activeElement !== periodInput) periodInput.value = state.periodMinutes;
      if (document.activeElement !== shotInput) shotInput.value = state.shotResetSeconds;
      if (document.activeElement !== timeoutInput) timeoutInput.value = state.timeoutsPerTeam;

      const nameA = document.getElementById("nameA");
      const nameB = document.getElementById("nameB");
      if (document.activeElement !== nameA) nameA.value = state.nameA;
      if (document.activeElement !== nameB) nameB.value = state.nameB;

      document.getElementById("gameClock").textContent = formatClock(state.gameRemaining);
      document.getElementById("gameClock").classList.toggle("expired", state.gameRemaining <= 0);
      document.getElementById("gameToggle").textContent = state.gameRunning
        ? "暫停"
        : (state.gameRemaining <= 0 ? "時間到" : "開始");
      document.getElementById("gameToggle").disabled = state.gameRemaining <= 0 && !state.gameRunning;

      document.getElementById("shotClock").textContent =
        String(Math.ceil(Math.max(0, state.shotRemaining) / 1000));
      document.getElementById("shotClock").classList.toggle("expired", state.shotRemaining <= 0);
      document.getElementById("shotToggle").textContent = state.shotRunning
        ? "暫停"
        : (state.shotRemaining <= 0 ? "時間到" : "開始");
      document.getElementById("shotToggle").disabled = state.shotRemaining <= 0 && !state.shotRunning;

      const possessionName = state.possession === "A" ? state.nameA : state.nameB;
      document.getElementById("possessionBtn").textContent = `${possessionName}持球　⇄`;
      document.getElementById("undoBtn").disabled = history.length === 0;
    }

    function ensureTicker() {
      if (intervalId !== null) return;

      intervalId = setInterval(() => {
        let changed = false;

        if (state.gameRunning) {
          state.gameRemaining = Math.max(0, state.gameEndAt - Date.now());
          if (state.gameRemaining <= 0) {
            state.gameRunning = false;
            state.gameEndAt = 0;
            announce("本節時間到");
          }
          changed = true;
        }

        if (state.shotRunning) {
          state.shotRemaining = Math.max(0, state.shotEndAt - Date.now());
          if (state.shotRemaining <= 0) {
            state.shotRunning = false;
            state.shotEndAt = 0;
            announce("進攻時間到");
          }
          changed = true;
        }

        if (changed) {
          persist();
          render();
        }

        if (!state.gameRunning && !state.shotRunning) {
          clearInterval(intervalId);
          intervalId = null;
        }
      }, 100);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    }

    function announce(message) {
      const status = document.getElementById("status");
      status.textContent = message;
      clearTimeout(announce.timeout);
      announce.timeout = setTimeout(() => {
        status.textContent = "";
      }, 2200);
    }

    document.getElementById("nameA").addEventListener("change", () => {
      state.nameA = document.getElementById("nameA").value.trim() || "主隊";
      persist();
      render();
    });

    document.getElementById("nameB").addEventListener("change", () => {
      state.nameB = document.getElementById("nameB").value.trim() || "客隊";
      persist();
      render();
    });

    document.getElementById("periodMinutes").addEventListener("keydown", event => {
      if (event.key === "Enter") applyPeriodMinutes();
    });

    document.getElementById("shotSeconds").addEventListener("keydown", event => {
      if (event.key === "Enter") applyShotSeconds();
    });

    document.getElementById("timeoutsPerTeam").addEventListener("change", applyTimeoutRule);

    document.addEventListener("keydown", event => {
      const target = event.target;
      if (target instanceof HTMLInputElement ||
          target instanceof HTMLTextAreaElement ||
          event.ctrlKey || event.altKey || event.metaKey) return;

      const key = event.key.toLowerCase();
      const shortcuts = {
        "1": () => addScore("A", 1),
        "2": () => addScore("A", 2),
        "3": () => addScore("A", 3),
        q: () => addScore("B", 1),
        w: () => addScore("B", 2),
        e: () => addScore("B", 3)
      };

      if (shortcuts[key]) {
        event.preventDefault();
        shortcuts[key]();
      } else if (event.code === "Space") {
        event.preventDefault();
        toggleGameClock();
      } else if (key === "z") {
        undo();
      }
    });

    render();
    ensureTicker();
  </script>
</body>
</html>
